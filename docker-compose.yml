services:
  serverest:
    image: paulogoncalvesbh/serverest:3.2.2
    container_name: serverest
    ports:
      - '${SERVEREST_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/usuarios > /dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
