name: Carga

# Teste de carga fora do pipeline de cada commit: roda a cada merge na main, nos PRs que mudam o teste de
# carga, toda semana e manualmente. O site e o relatório consolidado usam a última execução aprovada na main
# (scripts/carga-mais-recente.sh). Cada execução roda os dois cenários em paralelo, cada um
# com o próprio ServeRest: o oficial (500 usuários por 5 min, 1 s entre as ações) e o estresse
# (mesmos usuários, sem pausa), que procura o limite do sistema.
on:
  workflow_dispatch:
    inputs:
      vus:
        description: Usuários simultâneos (nos dois cenários)
        default: '500'
      patamar:
        description: 'Duração com todos os usuários no cenário oficial (ex.: 5m)'
        default: 5m
      patamar_estresse:
        description: 'Duração com todos os usuários no estresse (ex.: 2m)'
        default: 2m
  schedule:
    - cron: '0 6 * * 1' # segunda-feira, 06:00 UTC
  push:
    branches: [main]
  pull_request:
    paths:
      - 'load/**'
      - '.github/workflows/load.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  carga:
    name: ${{ matrix.cenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - cenario: oficial
            patamar: ${{ inputs.patamar || '5m' }}
            pausa: '1'
          - cenario: estresse
            patamar: ${{ inputs.patamar_estresse || '2m' }}
            pausa: '0'
    services:
      serverest:
        image: paulogoncalvesbh/serverest:3.2.2
        ports:
          - 3000:3000
        options: >-
          --health-cmd "wget -qO- http://localhost:3000/usuarios > /dev/null || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BASE_URL: http://localhost:3000
      RESULTADOS: load/reports
      VUS: ${{ inputs.vus || '500' }}
      PATAMAR: ${{ matrix.patamar }}
      PAUSA: ${{ matrix.pausa }}
      K6_WEB_DASHBOARD: 'true'
      K6_WEB_DASHBOARD_EXPORT: load/reports/k6-dashboard.html
    steps:
      - uses: actions/checkout@v7

      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.3.0'

      - name: Recursos da máquina de teste
        run: |
          mkdir -p load/reports
          echo "CPUs: $(nproc) | Memória: $(free -h | awk '/Mem/ {print $2}')" | tee load/reports/maquina.txt

      # Mede a CPU do ServeRest (docker stats) e do k6 (top) durante o teste, em % de um núcleo.
      # No estresse, os thresholds reprovam de propósito (k6 sai com 99): o job não falha por isso.
      - name: Executar teste de carga (${{ matrix.cenario }})
        env:
          SERVEREST: ${{ job.services.serverest.id }}
          CENARIO: ${{ matrix.cenario }}
        run: |
          while true; do
            docker stats --no-stream --format '{{.CPUPerc}}' "$SERVEREST" | tr -d '%' >> load/reports/cpu-serverest.txt
          done &
          AMOSTRAS=$!
          set +e
          k6 run load/scripts/carga-500vus.js &
          K6=$!
          top -b -d 2 -p "$K6" | awk -v pid="$K6" '$1 == pid { print $9; fflush() }' >> load/reports/cpu-k6.txt &
          TOP=$!
          wait "$K6"
          codigo=$?
          kill "$AMOSTRAS" "$TOP" 2>/dev/null
          if [ "$CENARIO" = estresse ] && [ "$codigo" -eq 99 ]; then
            echo "::notice title=Estresse::Thresholds reprovados, como esperado: o estresse procura o limite do sistema."
            exit 0
          fi
          exit "$codigo"

      - name: Resumo da execução
        if: always()
        run: node load/scripts/resumo.mjs load/reports "${{ matrix.cenario }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: carga-${{ matrix.cenario }}
          path: load/reports/
          if-no-files-found: warn
