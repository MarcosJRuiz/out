name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  mobile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Instalar dependências
        run: npm ci

      - name: Instalar driver UiAutomator2
        run: npm run -w mobile driver:install

      - name: Baixar APK
        run: npm run -w mobile app:download

      - name: Executar testes mobile no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save
          script: npm run -w mobile test:ci

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-report
          path: mobile/reports/
          if-no-files-found: warn
