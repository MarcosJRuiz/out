name: CI

# Roda a cada commit em qualquer branch; os checks do commit aparecem no PR,
# então pull_request não é necessário (evita execuções duplicadas).
on:
  push:
  workflow_dispatch:

# Um novo push no mesmo branch cancela a execução anterior, ainda em andamento.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

  mobile-tests:
    needs: lint
    # Provisório até a Fase 3: em branches o job é pulado para encurtar o feedback;
    # roda na main (merge) e manualmente. Na Fase 3 a condição sai e o job volta a
    # rodar em todo push, como exige o PDF.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_API_LEVEL: 33
    steps:
      - uses: actions/checkout@v4

      # O emulador precisa de ~7 GB para a partição userdata; o runner vem com pouco espaço livre.
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar driver UiAutomator2
        run: npm run -w mobile driver:install

      - name: Baixar APK
        run: npm run -w mobile app:download

      # Cache da imagem do Android e do snapshot do emulador já inicializado:
      # evita baixar a imagem (~2 min) e fazer boot a frio (~1 min) a cada execução.
      - name: Cache do emulador Android
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-${{ env.ANDROID_API_LEVEL }}
          key: avd-v1-api${{ env.ANDROID_API_LEVEL }}-google_apis-x86_64-4c-4096M-6000M

      - name: Criar snapshot do emulador (somente sem cache)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          script: echo "Snapshot do emulador gerado para o cache."

      - name: Executar testes mobile no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -no-metrics
          script: npm run -w mobile test:ci

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-report
          path: mobile/reports/
          if-no-files-found: warn
