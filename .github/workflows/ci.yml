name: CI

# Roda a cada commit em qualquer branch; os checks do commit aparecem no PR,
# então pull_request não é necessário (evita execuções duplicadas).
on:
  push:
  workflow_dispatch:

# Um novo push no mesmo branch cancela a execução anterior, ainda em andamento.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

  api-tests:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      serverest:
        image: paulogoncalvesbh/serverest:3.2.2
        ports:
          - 3000:3000
        options: >-
          --health-cmd "wget -qO- http://localhost:3000/usuarios > /dev/null || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SERVEREST_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes de API
        run: npm run test:ci -w api

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: api/reports/
          if-no-files-found: warn

