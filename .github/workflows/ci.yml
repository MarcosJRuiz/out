name: CI

# Roda a cada commit em qualquer branch; os checks do commit aparecem no PR,
# então pull_request não é necessário (evita execuções duplicadas).
on:
  push:
  workflow_dispatch:

# Um novo push no mesmo branch cancela a execução anterior, ainda em andamento.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

  api-tests:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      serverest:
        image: paulogoncalvesbh/serverest:3.2.2
        ports:
          - 3000:3000
        options: >-
          --health-cmd "wget -qO- http://localhost:3000/usuarios > /dev/null || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SERVEREST_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes de API
        run: npm run test:ci -w api

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-report
          path: api/reports/
          if-no-files-found: warn

  e2e-tests:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      - name: Executar testes E2E
        run: npm run test:ci -w e2e

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: e2e/reports/
          if-no-files-found: warn

  # Cenários que esperam o comportamento correto e falham por defeitos do site (docs/bugs/).
  # Não bloqueante: a falha é esperada e fica registrada no relatório como evidência.
  # Se os cenários passarem, o bug pode ter sido corrigido: o job emite um aviso para revisão.
  e2e-known-defects:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      # O código de saída é guardado em vez de falhar o passo: a falha é o resultado esperado
      # e não deve aparecer como erro nas anotações da execução.
      - name: Executar cenários de defeitos conhecidos
        id: defeitos
        run: |
          set +e
          npm run test:known-defects -w e2e
          echo "codigo=$?" >> "$GITHUB_OUTPUT"

      - name: Resumo dos defeitos conhecidos
        if: always()
        run: |
          if [ "${{ steps.defeitos.outputs.codigo }}" != "0" ]; then
            echo "::notice title=Falha esperada::Cenários @known-defect reproduziram os defeitos do site (BUG-001 e BUG-002). Ver docs/bugs/."
            {
              echo "### Defeitos conhecidos reproduzidos (falha esperada)"
              echo "- BUG-001: pagamento aceita cartão inválido — docs/bugs/BUG-001-cartao-invalido-aceito.md"
              echo "- BUG-002: compra segue sem endereço de entrega — docs/bugs/BUG-002-compra-sem-endereco-de-entrega.md"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Os cenários @known-defect passaram: os bugs podem ter sido corrigidos no site. Revise docs/bugs/ e as tags."
          fi

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-known-defects-report
          path: e2e/reports/
          if-no-files-found: warn

  mobile-tests:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # O emulador precisa de ~7 GB para a partição userdata; o runner vem com pouco espaço livre.
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar driver UiAutomator2
        run: npm run -w mobile driver:install

      - name: Baixar APK
        run: npm run -w mobile app:download

      # O download da imagem do Android (~1 GB) às vezes chega corrompido ("Error on ZipFile unknown archive").
      # Baixar antes, com novas tentativas, evita perder a execução; a action abaixo reaproveita a imagem instalada.
      - name: Baixar imagem do Android
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for tentativa in 1 2 3; do
            if yes | "$SDKMANAGER" --install "system-images;android-33;google_apis;x86_64" > /dev/null; then
              exit 0
            fi
            echo "::warning::Falha ao baixar a imagem do Android (tentativa $tentativa); tentando de novo"
            sleep 15
          done
          exit 1

      - name: Executar testes mobile no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -no-metrics
          script: npm run -w mobile test:ci

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-report
          path: mobile/reports/
          if-no-files-found: warn

  # Relatório Allure consolidado (API + E2E + mobile + último teste de carga) e resumo da execução na página da pipeline.
  publish-reports:
    needs: [api-tests, e2e-tests, e2e-known-defects, mobile-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Cada download pode faltar se o job correspondente falhou antes de publicar; o relatório sai com o que existir.
      - name: Baixar resultados de API
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: api-report
          path: resultados/api

      - name: Baixar resultados E2E
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: e2e-report
          path: resultados/e2e

      - name: Baixar resultados E2E (defeitos conhecidos)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: e2e-known-defects-report
          path: resultados/e2e-known-defects

      - name: Baixar resultados mobile
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: mobile-report
          path: resultados/mobile

      - name: Consolidar resultados
        run: >-
          node scripts/relatorio-consolidado.mjs
          API=resultados/api/allure-results
          E2E=resultados/e2e/allure-results
          E2E=resultados/e2e-known-defects/allure-results
          Mobile=resultados/mobile/allure-results
          --carga=evidencias/load

      - name: Gerar relatório Allure
        run: npx allure generate reports/allure-results

      - name: Resumo da execução
        run: |
          cat reports/resumo.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "**Relatório consolidado:** artifact \`relatorio-consolidado\` (Allure em arquivo HTML único, abre direto no navegador)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório consolidado
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-consolidado
          path: |
            reports/allure-report/index.html
            reports/resumo.md
