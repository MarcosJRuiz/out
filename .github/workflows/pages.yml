name: Pages

# Publica no GitHub Pages o relatório consolidado da última CI aprovada na main, os dashboards do k6 da última
# execução de Carga aprovada, os bug reports, a pipeline e o README: o GitHub não renderiza HTML no repositório,
# então tudo abre direto no navegador.
# Roda quando a CI ou o Carga terminam com sucesso na main; a execução manual publica a última CI aprovada.
on:
  workflow_run:
    workflows: [CI, Carga]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    # O filtro de branch do workflow_run olha só o nome da branch: na CI, o evento push exclui PRs vindos de forks.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.name == 'Carga' || github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Identificar a execução da CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          # Disparado pelo Carga (ou manualmente): o relatório vem da última CI aprovada na main.
          RUN_ID: ${{ github.event.workflow_run.name == 'CI' && github.event.workflow_run.id || '' }}
          SHA: ${{ github.event.workflow_run.name == 'CI' && github.event.workflow_run.head_sha || '' }}
        run: |
          if [ -z "$RUN_ID" ]; then
            read -r RUN_ID SHA < <(gh run list -R "$GITHUB_REPOSITORY" -w CI -b main -e push -s success -L 1 \
              --json databaseId,headSha -q '.[0] | "\(.databaseId) \(.headSha)"')
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ci.outputs.sha }}

      - name: Baixar o relatório consolidado
        uses: actions/download-artifact@v8
        with:
          name: relatorio-consolidado
          path: relatorio
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Página com menu lateral (.github/pages): relatório Allure, dashboards do k6, bug reports, pipeline e README.
      - name: Montar o site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.ci.outputs.sha }}
        run: |
          mkdir -p site
          cp relatorio/allure-report/index.html site/allure-report.html
          scripts/carga-mais-recente.sh site/load
          node .github/pages/montar.mjs site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v5
